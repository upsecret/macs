# ============================================================
# MACS E2E / 테스트 오버레이 — 테스트 전용 업스트림 컨테이너 모음.
#
# 운영 스택(docker-compose.yml)에는 포함하지 않는다. 테스트할 때만 함께 올린다:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
#
# 라우트·커넥터·권한은 init.sql 에 시드하지 않고 scripts/e2e-permission-test.sh 가
# 런타임에 admin API 로 주입한다(볼륨 보존, 재실행 안전).
#
# 포함 컨테이너:
#   dummy-api-server      8088  REST echo (헤더/StripPrefix/권한 라우팅 검증)
#   swagger-api-server    8090  OpenAPI(/v3/api-docs)+Swagger UI — API 커넥터 문서연동
#   dummy-mcp-server      8765  stateless, 인증 없음 — 게이트웨이 게이팅(AuthValidation)
#   dummy-mcp-auth        8766  MCP_BEARER_TOKEN — MCP 서버 자체 bearer 검증
#   dummy-mcp-stateful    8767  MCP_STATEFUL — Streamable HTTP 세션 강제
#   dummy-mcp-both        8768  bearer + stateful 동시
# ============================================================
services:
  # ── REST echo (e2e 권한/라우팅) ──────────────────────────
  dummy-api-server:
    build:
      context: ./infra/dummy-api-server
      dockerfile: Dockerfile
    container_name: macs-dummy-api-server
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - macs-network

  # ── Swagger API (API 커넥터 문서연동) ────────────────────
  # OpenAPI JSON 을 /v3/api-docs 로 제공 + Swagger UI(/swagger-ui) + 샘플 /api/products.
  swagger-api-server:
    build:
      context: ./infra/swagger-api-server
      dockerfile: Dockerfile
    container_name: macs-swagger-api-server
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - macs-network

  # ── MCP: stateless, 인증 없음 ────────────────────────────
  # echo, add 도구. 게이트웨이가 AuthValidation 으로 게이팅하는 시나리오.
  dummy-mcp-server:
    build:
      context: ./infra/dummy-mcp-server
      dockerfile: Dockerfile
    container_name: macs-dummy-mcp-server
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - macs-network

  # ── MCP: 자체 bearer 검증 ────────────────────────────────
  # 게이트웨이는 AuthValidation 없이 저장된 authToken 을 업스트림으로 주입 → 서버가 검증.
  dummy-mcp-auth:
    build:
      context: ./infra/dummy-mcp-server
      dockerfile: Dockerfile
    container_name: macs-dummy-mcp-auth
    environment:
      MCP_BEARER_TOKEN: mcp-secret-xyz
    ports:
      - "8766:8765"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - macs-network

  # ── MCP: stateful 세션 강제 ──────────────────────────────
  # initialize 응답으로 Mcp-Session-Id 발급, 이후 요청에 없으면 거절 → 게이트웨이 세션 처리 검증.
  dummy-mcp-stateful:
    build:
      context: ./infra/dummy-mcp-server
      dockerfile: Dockerfile
    container_name: macs-dummy-mcp-stateful
    environment:
      MCP_STATEFUL: "true"
    ports:
      - "8767:8765"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - macs-network

  # ── MCP: stateful + bearer 동시 ──────────────────────────
  dummy-mcp-both:
    build:
      context: ./infra/dummy-mcp-server
      dockerfile: Dockerfile
    container_name: macs-dummy-mcp-both
    environment:
      MCP_STATEFUL: "true"
      MCP_BEARER_TOKEN: both-secret-789
    ports:
      - "8768:8765"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - macs-network
